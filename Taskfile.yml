version: "3"

# Keep command noise down; demo-reset prints its own step banners.
silent: true

vars:
  UI_PORT: 8233
  DEMO_DIR: .demo

tasks:
  start:
    desc: Ensure the local Temporal environment (server + Web UI + worker) is running.
    cmds:
      - mkdir -p {{.DEMO_DIR}}
      - task: start-server
      - task: start-worker
      - echo "Temporal Web is at http://localhost:{{.UI_PORT}}"

  start-server:
    desc: Start the local Temporal dev server (includes Temporal Web) if not already up.
    status:
      - curl -sf -o /dev/null http://localhost:{{.UI_PORT}}
    cmds:
      - task: start-server-fresh

  start-server-fresh:
    desc: Always start Temporal and wait until the UI answers.
    internal: true
    cmds:
      - mkdir -p {{.DEMO_DIR}}
      - nohup temporal server start-dev --db-filename {{.DEMO_DIR}}/temporal.db --ui-port {{.UI_PORT}} --log-level warn > {{.DEMO_DIR}}/temporal.log 2>&1 &
      - |
        echo "Waiting for Temporal UI on http://localhost:{{.UI_PORT}} ..."
        for i in $(seq 1 60); do
          if curl -sf -o /dev/null http://localhost:{{.UI_PORT}}; then
            echo "TEMPORAL UP  http://localhost:{{.UI_PORT}}"
            exit 0
          fi
          sleep 0.5
        done
        echo "TEMPORAL FAILED to become ready on :{{.UI_PORT}}"
        tail -n 80 {{.DEMO_DIR}}/temporal.log || true
        exit 1

  start-worker:
    desc: Start the Workflow/Activity worker if not already running.
    status:
      - pgrep -f "(go run \./worker|go-build.*/worker$)" >/dev/null 2>&1
    cmds:
      - task: start-worker-fresh

  start-worker-fresh:
    desc: Always start the worker and wait until the process exists.
    internal: true
    cmds:
      - mkdir -p {{.DEMO_DIR}}
      - nohup go run ./worker > {{.DEMO_DIR}}/worker.log 2>&1 &
      - |
        echo "Waiting for worker process ..."
        for i in $(seq 1 40); do
          if pgrep -f "(go run \./worker|go-build.*/worker$)" >/dev/null 2>&1; then
            echo "WORKER UP"
            exit 0
          fi
          sleep 0.5
        done
        echo "WORKER FAILED to start"
        tail -n 80 {{.DEMO_DIR}}/worker.log || true
        exit 1

  reload-worker:
    desc: Restart the worker so it runs the current workflow.go/activity.go source.
    cmds:
      - pkill -f "go run \./worker" 2>/dev/null || true
      - pkill -f "go-build.*/worker$" 2>/dev/null || true
      - sleep 1
      - task: start-worker-fresh

  clean-temporal:
    desc: Remove local Temporal dev-server state so the next start has no workflow history.
    internal: true
    cmds:
      - rm -f {{.DEMO_DIR}}/temporal.db {{.DEMO_DIR}}/temporal.db-shm {{.DEMO_DIR}}/temporal.db-wal
      - echo "Wiped {{.DEMO_DIR}}/temporal.db (empty history on next start)."

  stop:
    desc: Stop the worker and the local Temporal dev server.
    cmds:
      - echo "Stopping worker + Temporal ..."
      - pkill -f "go run \./worker" 2>/dev/null || true
      - pkill -f "go-build.*/worker$" 2>/dev/null || true
      - pkill -f "temporal server start-dev" 2>/dev/null || true
      - |
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null http://localhost:{{.UI_PORT}}; then
            pkill -f "temporal server start-dev" 2>/dev/null || true
            sleep 0.5
          else
            break
          fi
        done
        if curl -sf -o /dev/null http://localhost:{{.UI_PORT}}; then
          echo "TEMPORAL STILL UP on :{{.UI_PORT}} after stop"
          exit 1
        fi
        echo "TEMPORAL DOWN"
        true
      - task: clean-temporal

  restart:
    desc: Stop the lab, wipe Temporal workflow history, and start fresh (empty).
    cmds:
      - task: stop
      - task: start-server-fresh
      - task: start-worker-fresh
      - echo "Temporal Web is at http://localhost:{{.UI_PORT}} (empty history)"

  demo-reset:
    desc: >-
      Down → reset lab files → Temporal UP (empty) → seed wrong-success repro.
    cmds:
      - |
        echo ""
        echo "=== demo-reset 1/5  DOWN ==="
      - task: stop
      - |
        echo ""
        echo "=== demo-reset 2/5  RESET lab files ==="
      - git switch lab/base
      - git restore --source=lab/base --staged --worktree -- workflow.go banking-client.go workflow_test.go
      - git restore --source=lab/base --staged --worktree -- .cursor/rules/
      - git clean -fdx -- requests/ .cursor/rules/
      - |
        set -e
        expected_rules=$(printf '%s\n' change-scope.mdc go-conventions.mdc)
        actual_rules=$(ls -1 .cursor/rules/ | sort)
        if [ "$actual_rules" != "$expected_rules" ]; then
          echo "FAIL: .cursor/rules/ must be only the two seeded rules"
          echo "$actual_rules"
          exit 1
        fi
        expected_requests="requests/PAY-1183/01-spec/TASK.md"
        actual_requests=$(find requests -type f 2>/dev/null | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')
        if [ "$actual_requests" != "$expected_requests" ]; then
          echo "FAIL: requests/ must contain only 01-spec/TASK.md"
          find requests -type f 2>/dev/null | sort || true
          exit 1
        fi
        dirty=$(git status --porcelain -- \
          workflow.go banking-client.go workflow_test.go activity.go shared.go \
          .cursor/skills .cursor/rules requests \
          Taskfile.yml LAB.md AGENTS.md go.mod go.sum .gitignore || true)
        if [ -n "$dirty" ]; then
          echo "FAIL: lab-relevant paths dirty:"
          echo "$dirty"
          exit 1
        fi
        echo "Lab files OK (broken app, seeded rules, 01-spec only)."
      - |
        echo ""
        echo "=== demo-reset 3/5  UP Temporal (empty history) ==="
      - task: start-server-fresh
      - task: start-worker-fresh
      - |
        set -e
        if ! curl -sf -o /dev/null http://localhost:{{.UI_PORT}}; then
          echo "FAIL: Temporal UI not responding"
          exit 1
        fi
        # Empty namespace: no workflows yet (db was wiped before start).
        count=$(temporal workflow count 2>/dev/null | awk '{print $NF}' || echo unknown)
        echo "TEMPORAL UP  http://localhost:{{.UI_PORT}}"
        echo "Workflow count: ${count} (expect 0 before seed)"
      - |
        echo ""
        echo "=== demo-reset 4/5  SEED wrong-success (-25) ==="
      - go run ./start -id=transfer-PAY-1183 -source=85-150 -target=43-812 -amount=-25 -ref=REF-2026-0806-0047
      - |
        echo ""
        echo "=== demo-reset 5/5  READY ==="
        echo "TEMPORAL UP     http://localhost:{{.UI_PORT}}"
        echo "Wrong-success   Workflow ID transfer-PAY-1183  (Completed, Withdraw+Deposit)"
        echo "Open that run, screenshot it, then continue the runbook."

  repro:
    desc: "Reproduce PAY-1183: transfer accepted with a negative amount."
    cmds:
      - task: reload-worker
      - go run ./start -id=transfer-PAY-1183 -source=85-150 -target=43-812 -amount=-25 -ref=REF-2026-0806-0047
      - 'echo "Open http://localhost:{{.UI_PORT}} -- inspect Workflow ID transfer-PAY-1183"'

  transfer:
    desc: Run an ordinary transfer.
    cmds:
      - task: reload-worker
      - go run ./start -id=transfer-2026-0806-0082 -source=85-150 -target=43-812 -amount=250 -ref=REF-2026-0806-0082
      - 'echo "Open http://localhost:{{.UI_PORT}} -- inspect Workflow ID transfer-2026-0806-0082"'

  verify:
    desc: Run the focused automated tests that prove the business behavior.
    cmds:
      - go vet ./...
      - go test ./... -v

  preflight:
    desc: Verify the whole demo environment end to end before the session.
    cmds:
      - go build ./...
      - task: restart
      - task: verify
      - task: repro
      - task: transfer
      - 'echo "Preflight OK -- Temporal Web at http://localhost:{{.UI_PORT}}"'
